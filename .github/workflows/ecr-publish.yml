
name: Build and Push PetClinic Images to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 520235901263.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and push microservice images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test all services
        run: ./mvnw -B package --file pom.xml

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push eight images
        shell: bash
        run: |
          set -euo pipefail

          declare -A services=(
            [spring-petclinic-config-server]=config-server
            [spring-petclinic-discovery-server]=discovery-server
            [spring-petclinic-api-gateway]=api-gateway
            [spring-petclinic-customers-service]=customers-service
            [spring-petclinic-visits-service]=visits-service
            [spring-petclinic-vets-service]=vets-service
            [spring-petclinic-genai-service]=genai-service
            [spring-petclinic-admin-server]=admin-server
          )

          declare -A ports=(
            [spring-petclinic-config-server]=8888
            [spring-petclinic-discovery-server]=8761
            [spring-petclinic-api-gateway]=8080
            [spring-petclinic-customers-service]=8081
            [spring-petclinic-visits-service]=8082
            [spring-petclinic-vets-service]=8083
            [spring-petclinic-genai-service]=8084
            [spring-petclinic-admin-server]=9090
          )

          for module in "${!services[@]}"; do
            service="${services[$module]}"
            port="${ports[$module]}"
            jar="$module/target/$module-4.0.1.jar"
            image="$ECR_REGISTRY/petclinic-dev-$service"

            if [[ ! -f "$jar" ]]; then
              echo "ERROR: Expected JAR not found: $jar"
              find "$module/target" -maxdepth 1 -name '*.jar' -print
              exit 1
            fi

            echo "Building $image using port $port"

            docker build \
              --platform linux/arm64 \
              --build-arg "ARTIFACT_NAME=$module-4.0.1" \
              --build-arg "EXPOSED_PORT=$port" \
              -f docker/Dockerfile \
              -t "$image:${GITHUB_SHA}" \
              "$module/target"

            docker push "$image:${GITHUB_SHA}"

            docker tag "$image:${GITHUB_SHA}" "$image:latest"
            docker push "$image:latest"
          done

